[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gathervis"
version = "0.14.4"
description = "Web-based seismic shot-gather viewer for remote GPU servers: lazy loading of huge files, SEG-Y import, cigvis-style 3-D volume slicing, geometry-linked browsing, filters/AGC, windowed spectra and f-k, first-break picking."
readme = "README.md"
license = { text = "MIT" }
keywords = ["seismic", "geophysics", "shot-gather", "segy", "visualization", "viewer", "fwi", "pre-stack", "seismology"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "panel>=1.3",
    "bokeh>=3.3",
    "plotly>=5.15",
    "torch>=2.4.0,<2.11",    # <2.11: newer cu13x builds drop V100 (CC 7.0) kernels
    "deepwave>=0.0.27",
]

# Make the cu121 index actually take effect: with explicit=true an index is
# only used for packages pinned to it via tool.uv.sources.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[project.scripts]
gathervis = "gathervis.__main__:main"

[project.optional-dependencies]
segy = ["segyio"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["gathervis*"]
