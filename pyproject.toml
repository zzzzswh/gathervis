[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gathervis"
version = "0.1.0"
description = "Interactive pre-stack seismic gather viewer for Python / GPU servers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "panel>=1.3",
    "bokeh>=3.3",
    "torch>=2.8.0",
    "deepwave>=0.0.27",
]

[project.optional-dependencies]
examples = ["deepwave"]          # pulls torch
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["gathervis*"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
