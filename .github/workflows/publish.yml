name: Publish to PyPI

# Real PyPI uploads happen ONLY from a published GitHub release, so the
# tag/version check below always runs and a version can't be pushed twice.
# Running the workflow by hand is a dry run against TestPyPI.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; only the publish job gets an OIDC token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # The tag must match gathervis.__version__, or the upload fails later
      # with a confusing 400. Read it from the built wheel's filename, i.e.
      # exactly what is about to be uploaded. Catch it here instead.
      - name: Check the tag matches __version__
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(ls dist/*.whl | sed -E 's|.*/gathervis-([^-]+)-.*|\1|')
          test "$tag" = "$ver" || { echo "tag $tag != version $ver"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release              # must match the Trusted Publisher on PyPI
      url: https://pypi.org/p/gathervis
    permissions:
      id-token: write          # required for trusted publishing; no token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
